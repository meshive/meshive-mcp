[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshive-mcp"
description = "Remote MCP server that lets AI agents use the Meshive GPU Cloud"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "SeungHyeon", email = "bsh12341@gmail.com" },
]
dynamic = ["version"]
dependencies = [
    # 2.x 는 FastMCP 가 MCPServer 로 바뀐 새 API. 1.x 코드와 호환되지 않으므로 상한을 둔다.
    "mcp>=2.1,<3",
    # 0.1.1: Serving.scale_raises_cost / autoscale / price_cap_per_hour, get_task_logs(cursor=) tail 계약, disk_gb 제거.
    # scale_serving 의 승인 판정이 이 버전의 SDK 에 있다. real 이미지 빌드는 PyPI 에 이 릴리스가 있어야 통과한다.
    "meshive>=0.1.1,<0.2",
    "httpx>=0.27",
]
keywords = ["meshive", "mcp", "gpu", "cloud", "ai", "agent"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "anyio>=4",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://meshive.ai"
Documentation = "https://docs.meshive.ai/sdk-cli/"
Repository = "https://github.com/meshive/meshive-mcp"

[project.scripts]
meshive-mcp = "meshive_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["meshive_mcp*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = { attr = "meshive_mcp._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -ra -p anyio"
