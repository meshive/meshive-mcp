[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshive-mcp"
description = "Remote MCP server that lets AI agents use the Meshive GPU Cloud"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "SeungHyeon", email = "bsh12341@gmail.com" },
]
dynamic = ["version"]
dependencies = [
    # 2.x is the new API where FastMCP became MCPServer. Not compatible with 1.x code, hence the upper bound.
    "mcp>=2.1,<3",
    # The SDK major version this server is built and tested against; 1.1 adds local_volumes, cpu_line, list_cpus and
    # get_transaction, which the tools use.
    # Building the real image only passes when PyPI has a release satisfying this pin (ci.yml pre-check) — the SDK tag and PyPI release come first.
    "meshive>=1.1,<2",
    # httpx 1.0 changes the API (its development releases drop names the SDK uses), so stay below it.
    "httpx>=0.27,<1",
]
keywords = ["meshive", "mcp", "gpu", "cloud", "ai", "agent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "anyio>=4",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://meshive.ai"
Documentation = "https://docs.meshive.ai/sdk-cli/"
Repository = "https://github.com/meshive/meshive-mcp"

[project.scripts]
meshive-mcp = "meshive_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["meshive_mcp*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = { attr = "meshive_mcp._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -ra -p anyio"
