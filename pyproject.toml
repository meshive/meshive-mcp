[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshive-mcp"
description = "Remote MCP server that lets AI agents use the Meshive GPU Cloud"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "SeungHyeon", email = "bsh12341@gmail.com" },
]
dynamic = ["version"]
dependencies = [
    # 2.x 는 FastMCP 가 MCPServer 로 바뀐 새 API. 1.x 코드와 호환되지 않으므로 상한을 둔다.
    "mcp>=2.1,<3",
    # 0.1.x: 읽기 27 + 쓰기 18 메서드(파드/스토리지/서빙/태스크/로그). 쓰기 도구는 이 버전이 필요하다.
    "meshive>=0.1.0rc1,<0.2",  # rc 명시 → pip 가 프리릴리스 허용(git dev·PyPI rc 모두 설치 가능). 정식 0.1.0 이후에도 무해
    "httpx>=0.27",
]
keywords = ["meshive", "mcp", "gpu", "cloud", "ai", "agent"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "anyio>=4",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://meshive.ai"
Documentation = "https://docs.meshive.ai/sdk-cli/"
Repository = "https://github.com/meshive/meshive-mcp"

[project.scripts]
meshive-mcp = "meshive_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["meshive_mcp*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = { attr = "meshive_mcp._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -ra -p anyio"
