# dev/real 푸시마다 Docker Hub 공개 이미지 docker.io/meshive/meshive-mcp 를 올린다.
#
#   dev  → :dev, :dev-<짧은 SHA>
#   real → :latest, :<버전>(_version.py), :real-<짧은 SHA>
#
# ECR 대신 Docker Hub 인 이유: public 레포·공개 이미지라 저장/전송 요금이 0 이고, 사용자가
# `docker run meshive/meshive-mcp` 로 직접 띄울 수 있다. 클러스터도 imagePullSecrets 없이 받는다.
# GitHub 호스팅 러너를 쓰고 pull_request 트리거를 두지 않는 이유는 ci.yml 참고(public 레포).
name: Publish image to Docker Hub

on:
  push:
    branches:
      - dev
      - real

env:
  IMAGE: docker.io/meshive/meshive-mcp

permissions:
  contents: read

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        run: |
          sha="${GITHUB_SHA::12}"
          if [ "$GITHUB_REF_NAME" = "real" ]; then
            version="$(python3 -c 'import re,pathlib; print(re.search(r"\"([^\"]+)\"", pathlib.Path("meshive_mcp/_version.py").read_text()).group(1))')"
            tags="$IMAGE:latest,$IMAGE:$version,$IMAGE:real-$sha"
            sdk_spec=""   # real 은 PyPI 의 meshive
          else
            tags="$IMAGE:dev,$IMAGE:dev-$sha"
            sdk_spec="meshive @ git+https://github.com/meshive/meshive-python@dev"   # dev 는 SDK dev 브랜치
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "sdk_spec=$sdk_spec" >> "$GITHUB_OUTPUT"
          echo "$tags"

      # real 이미지는 PyPI 의 **정식(stable)** meshive 를 설치한다(Dockerfile: MESHIVE_SDK_SPEC 비움 → `pip install .`).
      # pyproject 의 요구 범위를 만족하는 정식 릴리스가 PyPI 에 없으면 빌드 막바지에 pip 해석 실패로 죽는다 — 여기서 같은
      # 해석기(pip, --pre 없음)로 먼저 확인해 순서(meshive-python 태그·PyPI 배포 → meshive-mcp real)를 안내한다.
      # 프리릴리스(0.1.0rc1 등)는 pip 기본 해석에서 제외되므로 통과시키지 않는다 — real 은 stable 만 쓴다.
      - name: Check the meshive SDK release is on PyPI (real only)
        if: github.ref_name == 'real'
        run: |
          spec="$(python3 - <<'PY'
          import re, tomllib, pathlib
          deps = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["dependencies"]
          print(next(d for d in deps if re.match(r"^meshive\s*([<>=!~]|$)", d)))
          PY
          )"
          echo "required by pyproject: $spec"
          if ! python3 -m pip download --quiet --no-deps --dest /tmp/meshive-sdk-check "$spec"; then
            echo "::error::No stable meshive release on PyPI satisfies '$spec'. Publish meshive-python first (tag vX.Y.Z -> PyPI), then merge meshive-mcp to real."
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # arm64 도 같이 — Apple Silicon 에서 `docker run meshive/meshive-mcp` 가 되게. 클러스터는 amd64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            MESHIVE_SDK_SPEC=${{ steps.tags.outputs.sdk_spec }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
