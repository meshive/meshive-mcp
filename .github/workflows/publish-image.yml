# dev/real 푸시마다 Docker Hub 공개 이미지 docker.io/meshive/meshive-mcp 를 올린다.
#
#   dev  → :dev, :dev-<짧은 SHA>
#   real → :latest, :<버전>(_version.py), :real-<짧은 SHA>
#
# ECR 대신 Docker Hub 인 이유: public 레포·공개 이미지라 저장/전송 요금이 0 이고, 사용자가
# `docker run meshive/meshive-mcp` 로 직접 띄울 수 있다. 클러스터도 imagePullSecrets 없이 받는다.
# GitHub 호스팅 러너를 쓰고 pull_request 트리거를 두지 않는 이유는 ci.yml 참고(public 레포).
name: Publish image to Docker Hub

on:
  push:
    branches:
      - dev
      - real

env:
  IMAGE: docker.io/meshive/meshive-mcp

permissions:
  contents: read

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        run: |
          sha="${GITHUB_SHA::12}"
          if [ "$GITHUB_REF_NAME" = "real" ]; then
            version="$(python3 -c 'import re,pathlib; print(re.search(r"\"([^\"]+)\"", pathlib.Path("meshive_mcp/_version.py").read_text()).group(1))')"
            tags="$IMAGE:latest,$IMAGE:$version,$IMAGE:real-$sha"
          else
            tags="$IMAGE:dev,$IMAGE:dev-$sha"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "$tags"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # arm64 도 같이 — Apple Silicon 에서 `docker run meshive/meshive-mcp` 가 되게. 클러스터는 amd64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
