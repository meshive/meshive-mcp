# dev/real 푸시마다 ECR <브랜치>/meshive-mcp:latest 로 이미지를 올린다 (다른 서비스와 같은 태그 규칙).
#
# 다른 레포와 다른 점 두 가지 — 이 레포가 public 이기 때문이다:
#   - GitHub 호스팅 러너(ubuntu-latest)를 쓴다. self-hosted 러너를 public 레포에 붙이면 포크 PR 이
#     회사 러너에서 코드를 실행할 수 있다.
#   - pull_request 트리거가 없다. 빌드 검증은 ci.yml 이 맡고(시크릿 불필요), 여기는 푸시 전용.
name: Upload image to Amazon ECR

on:
  push:
    branches:
      - dev
      - real

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: ${{ github.ref_name }}/meshive-mcp

permissions:
  contents: read

jobs:
  deploy:
    name: Build and push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::12}" .
          docker push --all-tags "$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
