# 테스트 → 이미지 빌드·스모크 → (dev/real 푸시일 때만) Docker Hub 공개 이미지 docker.io/meshive/meshive-mcp 발행.
#
#   dev  → :dev, :dev-<짧은 SHA>      SDK 는 meshive-python **dev 브랜치의 빌드 시점 커밋** 으로 고정
#   real → :latest, :<버전>(_version.py), :real-<짧은 SHA>   SDK 는 PyPI 의 meshive
#
# 발행이 예전엔 별도 워크플로(publish-image.yml)라 테스트와 독립이었고, 깨진 커밋도 :dev/:latest 가 됐다. 지금은 test 잡을
# 통과한 커밋만 발행한다. 어떤 MCP 커밋이 어떤 SDK 커밋으로 도는지는 이미지 라벨(org.opencontainers.image.revision,
# ai.meshive.sdk.revision)과 /healthz(revision, sdk_version, sdk_revision)에 남는다 (2026-09-09 리뷰 C2).
#
# ECR 대신 Docker Hub 인 이유: public 레포·공개 이미지라 저장/전송 요금이 0 이고, 사용자가 `docker run meshive/meshive-mcp` 로
# 직접 띄울 수 있다. 클러스터도 imagePullSecrets 없이 받는다. GitHub 호스팅 러너 — public 레포는 무료이고 self-hosted 러너를
# 외부 PR 에 노출하지 않는다.
name: CI

on:
  push:
    branches: [dev, real]
  pull_request:

env:
  IMAGE: docker.io/meshive/meshive-mcp

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest

  image:
    name: Build, smoke-test, publish (dev/real push)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SDK 소스와 태그를 한 곳에서 정한다. real 푸시만 PyPI, 그 외(dev 푸시·PR)는 SDK dev 브랜치의 **지금 커밋** —
      # 이동하는 @dev 대신 SHA 로 고정해야 같은 이미지를 다시 빌드해도 같은 SDK 가 들어가고, 무엇이 들어갔는지 기록된다.
      - name: Resolve SDK source and image tags
        id: meta
        run: |
          sha="${GITHUB_SHA::12}"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "real" ]; then
            version="$(python3 -c 'import re,pathlib; print(re.search(r"\"([^\"]+)\"", pathlib.Path("meshive_mcp/_version.py").read_text()).group(1))')"
            tags="$IMAGE:latest,$IMAGE:$version,$IMAGE:real-$sha"
            sdk_spec=""       # real 은 PyPI 의 meshive (아래 사전 확인)
            sdk_rev=""        # 설치된 버전은 /healthz 의 sdk_version 으로 확인
          else
            sdk_rev="$(git ls-remote https://github.com/meshive/meshive-python refs/heads/dev | cut -f1)"
            if [ -z "$sdk_rev" ]; then
              echo "::error::could not resolve meshive-python dev branch"; exit 1
            fi
            tags="$IMAGE:dev,$IMAGE:dev-$sha"
            sdk_spec="meshive @ git+https://github.com/meshive/meshive-python@${sdk_rev}"
          fi
          {
            echo "tags=$tags"
            echo "sdk_spec=$sdk_spec"
            echo "sdk_rev=$sdk_rev"
          } >> "$GITHUB_OUTPUT"
          echo "tags=$tags"; echo "sdk=${sdk_spec:-pypi} rev=${sdk_rev:-pypi}"

      # real 이미지는 PyPI 의 meshive 를 설치한다(Dockerfile: MESHIVE_SDK_SPEC 비움 → `pip install .`). pyproject 의 요구
      # 범위를 만족하는 릴리스가 PyPI 에 없으면 빌드 막바지에 pip 해석 실패로 죽는다 — 여기서 같은 해석기(pip, --pre 없음)로
      # 먼저 확인해 순서(meshive-python 태그·PyPI 배포 → meshive-mcp real)를 안내한다. 무엇이 통과하는지는 핀이 정한다.
      - name: Check the meshive SDK release is on PyPI (real only)
        if: github.event_name == 'push' && github.ref_name == 'real'
        run: |
          spec="$(python3 - <<'PY'
          import re, tomllib, pathlib
          deps = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["dependencies"]
          print(next(d for d in deps if re.match(r"^meshive\s*([<>=!~]|$)", d)))
          PY
          )"
          echo "required by pyproject: $spec"
          if ! python3 -m pip download --quiet --no-deps --dest /tmp/meshive-sdk-check "$spec"; then
            echo "::error::No meshive release on PyPI satisfies '$spec'. Publish meshive-python first (tag vX.Y.Z -> PyPI), then merge meshive-mcp to real."
            exit 1
          fi

      - name: Build image (no push)
        run: |
          docker build \
            --build-arg MESHIVE_SDK_SPEC="${{ steps.meta.outputs.sdk_spec }}" \
            --build-arg MESHIVE_MCP_REVISION="$GITHUB_SHA" \
            --build-arg MESHIVE_SDK_REVISION="${{ steps.meta.outputs.sdk_rev }}" \
            -t meshive-mcp:ci .

      # /healthz 가 뜨고, 박아 넣은 리비전이 그대로 읽히는지까지 본다 — 라벨만 있고 런타임에서 안 보이면 배포 확인에 못 쓴다.
      - name: Smoke-test /healthz
        run: |
          docker run -d --name mcp -p 8080:8080 meshive-mcp:ci
          for i in $(seq 1 20); do
            if body="$(curl -fsS http://127.0.0.1:8080/healthz)"; then
              echo "$body"
              echo "$body" | python3 -c "import json,sys,os; b=json.load(sys.stdin); assert b['status']=='ok' and b['revision']==os.environ['GITHUB_SHA'], b"
              exit 0
            fi
            sleep 1
          done
          docker logs mcp
          exit 1

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # arm64 도 같이 — Apple Silicon 에서 `docker run meshive/meshive-mcp` 가 되게. 클러스터는 amd64.
      - name: Set up QEMU
        if: github.event_name == 'push'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            MESHIVE_SDK_SPEC=${{ steps.meta.outputs.sdk_spec }}
            MESHIVE_MCP_REVISION=${{ github.sha }}
            MESHIVE_SDK_REVISION=${{ steps.meta.outputs.sdk_rev }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
